name: ps2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install 32-bit libc (for asset integration test)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386
      - name: Run interpreter tests
        run: bash port/tests/run.sh

  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build tools
        run: apk add --no-cache make git cmake pkgconf || true

      - name: Build + install gsKit
        run: |
          if ! find "$PS2SDK/ports" -name 'libgsKit.a' 2>/dev/null | grep -q .; then
            git clone --depth 1 https://github.com/ps2dev/gsKit.git /tmp/gsKit
            make -C /tmp/gsKit -j"$(nproc)"
            make -C /tmp/gsKit install
          fi
          find "$PS2SDK/ports" -name 'libgsKit.a'

      - name: Build port
        run: make -C port

      - name: Probe EE C++ toolchain
        continue-on-error: true
        run: |
          echo "PS2DEV=$PS2DEV  PS2SDK=$PS2SDK"
          echo "--- sdl2 / pthread headers shipped by ps2sdk? ---"
          ls "$PS2SDK/ports/include" 2>/dev/null | grep -i sdl || echo "(no SDL under ports/include)"
          ls "$PS2SDK/ee/include" 2>/dev/null | grep -iE 'pthread|thread' || echo "(no pthread under ee/include)"
          echo "--- try C++ compilers ---"
          for cxx in mips64r5900el-ps2-elf-g++ mips64r5900el-ps2-elf-c++; do
            command -v "$cxx" >/dev/null 2>&1 || continue
            for std in c++20 c++17; do
              for combo in "base:" "-DPROBE_THREADS:-latomic" "-DPROBE_FILESYSTEM:-latomic" "-DPROBE_THREADS -DPROBE_FILESYSTEM:-latomic"; do
                defs="${combo%%:*}"; libs="${combo##*:}"
                echo "== $cxx -std=$std [$defs] [$libs] =="
                if "$cxx" -std=$std -O2 $defs platform/ps2/probe.cpp -o /tmp/probe_ee -lm $libs 2>/tmp/err; then
                  echo "OK: $cxx -std=$std $defs $libs builds"
                else
                  echo "FAIL: $cxx -std=$std $defs $libs"
                  head -4 /tmp/err
                fi
              done
            done
          done

      - name: Probe decomp compile for the EE
        continue-on-error: true
        run: |
          MM_REV=bf6bd9d0d3a90fe2f8960e034fbfd328e8bdef22
          rm -rf /tmp/mm && git init -q /tmp/mm
          git -C /tmp/mm remote add origin https://github.com/zeldaret/mm
          git -C /tmp/mm fetch -q --depth 1 origin "$MM_REV"
          git -C /tmp/mm checkout -q FETCH_HEAD
          git -C /tmp/mm submodule update -q --init --depth 1 || true
          CC=mips64r5900el-ps2-elf-gcc
          INC="-Iinclude -Iinclude/libc -Isrc -I."
          for f in \
              src/libultra/os/createmesgqueue.c \
              src/libultra/gu/perspective.c \
              src/libultra/gu/lookat.c \
              src/code/sys_math3d.c \
              src/code/z_actor.c ; do
            echo "== $f =="
            if "$CC" -c -O1 -w -DNON_MATCHING -D_LANGUAGE_C -mno-abicalls $INC \
                 "/tmp/mm/$f" -o /tmp/mm.o 2>/tmp/err; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              head -15 /tmp/err
            fi
          done

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: mm-ps2-elf
          path: port/mm-ps2.elf
